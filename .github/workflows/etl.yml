name: Cisco AI Crawler Commit
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          pip install crawl4ai requests
          playwright install chromium

      - name: Ejecutar Crawler AI Incremental
        run: python3 src/crawler_ai.py
        
      - name: Evaluar y Disparar Siguiente Lote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "logs/more_work.flag" ]; then
            echo "Trabajo pendiente detectado. Iniciando nuevo lote en cola..."
            gh workflow run etl.yml
          else
            echo "No hay trabajo pendiente. Finalizando ETL."
          fi
          
