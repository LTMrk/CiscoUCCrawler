name: Cisco AI Crawler Local Commit
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          pip install crawl4ai requests
          playwright install chromium

      - name: Configurar Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ejecutar Crawler AI
        run: python3 src/crawler_ai.py

      - name: Confirmar y Subir Cambios
        run: |
          git add docs/
          git diff --staged --quiet || (git commit -m "docs: actualizacion automatica de markdown cisco" && git push)
          
